<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="t">
  <title id="t">Zeichnung des Praxisgebäudes der Gemeinschaftspraxis Gesenhues &amp; Partner</title>
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e7fa"/>
      <stop offset="1" stop-color="#f3f8fd"/>
    </linearGradient>
    <linearGradient id="und" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb0e0"/>
      <stop offset="1" stop-color="#2a5caa"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b5266"/>
      <stop offset="0.55" stop-color="#5d7891"/>
      <stop offset="1" stop-color="#3a4f62"/>
    </linearGradient>
    <linearGradient id="spiegel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fassade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f4f7"/>
    </linearGradient>
    <pattern id="ziegel" width="36" height="16" patternUnits="userSpaceOnUse">
      <rect width="36" height="16" fill="#c9a291"/>
      <rect x="1" y="1" width="16" height="6.5" rx="1" fill="#a95a43"/>
      <rect x="19" y="1" width="16" height="6.5" rx="1" fill="#b4644b"/>
      <rect x="-8" y="9" width="16" height="6.5" rx="1" fill="#b86a50"/>
      <rect x="10" y="9" width="16" height="6.5" rx="1" fill="#a2533d"/>
      <rect x="28" y="9" width="16" height="6.5" rx="1" fill="#ad5e46"/>
    </pattern>
    <pattern id="lamellen" width="10" height="7" patternUnits="userSpaceOnUse">
      <rect width="10" height="7" fill="#5f6a74"/>
      <rect y="5" width="10" height="2" fill="#4a545d"/>
    </pattern>
  </defs>

  <!-- Himmel, Sonne, Wolken -->
  <rect width="720" height="600" fill="url(#himmel)"/>
  <circle cx="616" cy="80" r="58" fill="#fff4d2" opacity=".55"/>
  <circle cx="616" cy="80" r="38" fill="#ffe08f"/>
  <g fill="#ffffff" opacity=".9">
    <rect x="96" y="72" width="128" height="30" rx="15"/>
    <rect x="124" y="56" width="62" height="34" rx="17"/>
    <rect x="430" y="118" width="96" height="22" rx="11"/>
  </g>

  <!-- Boden -->
  <rect y="500" width="720" height="100" fill="#e6ecf2"/>
  <rect y="500" width="720" height="6" fill="#d3dbe4"/>

  <!-- Baum links -->
  <rect x="58" y="400" width="10" height="102" rx="4" fill="#7a6252"/>
  <circle cx="62" cy="372" r="46" fill="#86b896"/>
  <circle cx="34" cy="398" r="30" fill="#76ab88"/>
  <circle cx="92" cy="396" r="32" fill="#6fa382"/>
  <circle cx="64" cy="336" r="28" fill="#94c3a2"/>

  <!-- Erdgeschoss: Backstein und Glas, leicht zurückgesetzt -->
  <rect x="122" y="336" width="500" height="166" fill="url(#ziegel)"/>
  <rect x="318" y="356" width="284" height="146" fill="url(#glas)"/>
  <rect x="318" y="356" width="284" height="146" fill="url(#spiegel)"/>
  <g stroke="#e9eef3" stroke-width="5">
    <line x1="318" y1="356" x2="602" y2="356"/>
    <line x1="388" y1="356" x2="388" y2="502"/>
    <line x1="458" y1="356" x2="458" y2="502"/>
    <line x1="528" y1="356" x2="528" y2="502"/>
    <line x1="318" y1="356" x2="318" y2="502"/>
    <line x1="602" y1="356" x2="602" y2="502"/>
  </g>
  <!-- Eingangstür -->
  <rect x="462" y="392" width="62" height="110" fill="#2c3d4d"/>
  <rect x="462" y="392" width="62" height="110" fill="url(#spiegel)"/>
  <rect x="510" y="440" width="4" height="24" rx="2" fill="#e9eef3"/>
  <!-- Praxisschild neben der Tür -->
  <rect x="236" y="380" width="58" height="76" rx="3" fill="#f7f9fb"/>
  <rect x="244" y="392" width="42" height="5" rx="2" fill="#8fb0e0"/>
  <rect x="244" y="404" width="34" height="3" rx="1.5" fill="#b9c4d1"/>
  <rect x="244" y="412" width="38" height="3" rx="1.5" fill="#b9c4d1"/>
  <rect x="244" y="420" width="30" height="3" rx="1.5" fill="#b9c4d1"/>
  <rect x="244" y="432" width="36" height="3" rx="1.5" fill="#b9c4d1"/>

  <!-- Schatten unter dem Obergeschoss -->
  <rect x="122" y="336" width="500" height="16" fill="#1d2b38" opacity=".18"/>

  <!-- Obergeschoss: weißer Kubus -->
  <rect x="96" y="150" width="552" height="190" fill="url(#fassade)"/>
  <rect x="96" y="150" width="552" height="6" fill="#dfe5ec"/>
  <rect x="96" y="334" width="552" height="6" fill="#d7dee6"/>
  <!-- Fenster mit Außenjalousien -->
  <g>
    <rect x="150" y="182" width="74" height="86" fill="#3f4b55"/>
    <rect x="154" y="186" width="66" height="58" fill="url(#lamellen)"/>
    <rect x="272" y="182" width="74" height="86" fill="#3f4b55"/>
    <rect x="276" y="186" width="66" height="70" fill="url(#lamellen)"/>
    <rect x="394" y="182" width="74" height="86" fill="#3f4b55"/>
    <rect x="398" y="186" width="66" height="44" fill="url(#lamellen)"/>
    <rect x="398" y="230" width="66" height="34" fill="#6f8aa3"/>
    <rect x="516" y="182" width="74" height="86" fill="#3f4b55"/>
    <rect x="520" y="186" width="66" height="62" fill="url(#lamellen)"/>
  </g>
  <!-- Schriftzug mit dem Logo-„&“ -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#8a939c">
    <text x="330" y="318" font-size="24" letter-spacing="3" text-anchor="end">GESENHUES</text>
    <text x="384" y="318" font-size="24" letter-spacing="3">PARTNER</text>
  </g>
  <path d="M340 286 a26 22 0 1 1 46 -6" fill="none" stroke="url(#und)" stroke-width="4" stroke-linecap="round"/>
  <text x="358" y="326" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="56" fill="url(#und)" text-anchor="middle">&amp;</text>

  <!-- Fahrradbügel und Pflanzkübel -->
  <g stroke="#9aa6b2" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M150 502 v-30 a14 14 0 0 1 28 0 v30"/>
    <path d="M196 502 v-30 a14 14 0 0 1 28 0 v30"/>
  </g>
  <rect x="612" y="462" width="40" height="40" rx="4" fill="#c7cfd8"/>
  <circle cx="632" cy="448" r="22" fill="#86b896"/>
  <circle cx="620" cy="438" r="14" fill="#94c3a2"/>
</svg>
